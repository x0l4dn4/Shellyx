services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 15

  web:
    build: ./web
    ports:
      - "8080:80"
    volumes:
      - ./web/src:/var/www/html:ro
      - ./web/config/php.ini:/usr/local/etc/php/conf.d/zz-ctf.ini:ro
    environment:
      DB_HOST: db
      DB_NAME: appdb
      DB_USER: appuser
      DB_PASS: apppass
    extra_hosts:
      - "attacker:host-gateway"
    depends_on:
      db:
        condition: service_healthy
